services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NEXTJS_WEBHOOK_URL=https://gotek.vercel.app/api/whatsapp-webhook
      - DB_PATH=/app/data/wa-session.db
      - HTTP_PORT=8080
    volumes:
      - wa-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  wa-data:
    driver: local
