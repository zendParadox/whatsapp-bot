services:
  whatsapp-bot:
    image: ghcr.io/zendparadox/whatsapp-bot:latest
    container_name: whatsapp-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NEXTJS_WEBHOOK_URL=https://gotek.vercel.app/api/whatsapp-webhook
      - DB_PATH=/app/data/wa-session.db
      - HTTP_PORT=8080
    volumes:
      - wa-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Watchtower: otomatis cek & pull image baru setiap 5 menit
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Login config untuk GHCR (private repo)
      - ~/.docker/config.json:/config.json:ro

volumes:
  wa-data:
    driver: local
