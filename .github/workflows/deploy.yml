name: Build & Deploy to Server

on:
  push:
    branches: [main]
    paths:
      - "main.go"
      - "go.mod"
      - "go.sum"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binary for ARM64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o whatsapp-bot-linux main.go
          ls -lh whatsapp-bot-linux

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy - Stop service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "⏹️ Stopping service..."
            sudo systemctl stop whatsapp-bot
            echo "✅ Service stopped"

      - name: Deploy - Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "whatsapp-bot-linux"
          target: "/www/opt/whatsapp-bot/"
          overwrite: true

      - name: Deploy - Start service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            chmod +x /www/opt/whatsapp-bot/whatsapp-bot-linux
            sudo systemctl start whatsapp-bot
            sleep 2
            sudo systemctl status whatsapp-bot
            echo "✅ Deploy complete!"
